name: Zyklus-APK bauen

# Builds an installable APK of the calendar with the cycle feature.
# Runs on every push to feature/zyklus and can also be started manually (Actions tab -> "Run workflow").
on:
  push:
    branches: [feature/zyklus]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      # Always sign with the same debug key, so a new APK can be installed over the old one without losing data
      - name: Festen Signaturschlüssel verwenden
        run: |
          mkdir -p ~/.android
          cp .github/zyklus-debug.keystore ~/.android/debug.keystore

      - name: APK bauen
        run: ./gradlew assembleFossDebug --stacktrace

      - name: APK zum Herunterladen bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: kalender-zyklus-apk
          path: app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
